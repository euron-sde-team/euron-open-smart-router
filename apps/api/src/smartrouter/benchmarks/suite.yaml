# SmartRouter benchmark suite. Each case: task, difficulty 1 (trivial) to 5 (hard), the
# messages sent to the model, and a deterministic grader. Graders:
#   exact     normalised answer equals `expected`
#   choice    the answer contains `expected` and none of the other `choices`
#   number    the first number in the answer equals `expected` (within `tolerance`)
#   contains  the answer contains every string in `expected` as a whole word or phrase
#   json      the answer parses as JSON and has every key/value in `expected`
#   regex     the answer matches the regex in `expected`
version: "2026.11"
cases:
  # classification
  - {id: cls-1, task: classification, difficulty: 1, grader: choice, choices: [positive, negative], expected: positive,
     prompt: "Classify the sentiment as positive or negative. Answer with one word.\n\nReview: I love this product, it works perfectly."}
  - {id: cls-2, task: classification, difficulty: 1, grader: choice, choices: [spam, ham], expected: spam,
     prompt: "Is this message spam or ham? One word.\n\nCONGRATULATIONS! You won a free cruise. Click now to claim."}
  - {id: cls-3, task: classification, difficulty: 2, grader: choice, choices: [billing, technical, account], expected: billing,
     prompt: "Categorize the support ticket as billing, technical or account. One word.\n\nI was charged twice for my October invoice."}
  - {id: cls-4, task: classification, difficulty: 3, grader: choice, choices: [positive, negative, mixed], expected: mixed,
     prompt: "Label the sentiment as positive, negative or mixed. One word.\n\nThe camera is superb but the battery dies before lunch."}
  - {id: cls-5, task: classification, difficulty: 3, grader: choice, choices: [urgent, normal, low], expected: urgent,
     prompt: "Classify the priority as urgent, normal or low. One word.\n\nProduction checkout is returning 500 errors for every customer since 09:00."}
  - {id: cls-6, task: classification, difficulty: 4, grader: choice, choices: [sarcastic, sincere], expected: sarcastic,
     prompt: "Is this review sarcastic or sincere? One word.\n\nOh great, another update that deletes my settings. Exactly what I wanted on a Monday."}
  - {id: cls-7, task: classification, difficulty: 1, grader: choice, choices: [positive, negative], expected: negative,
     prompt: "Is this review positive or negative? Reply with one word.\n\nTerrible service, the food was cold and the waiter ignored us for twenty minutes."}
  - {id: cls-8, task: classification, difficulty: 1, grader: choice, choices: [question, statement], expected: question,
     prompt: "Is the following sentence a question or a statement? One word.\n\nWhat time does the store open on Sundays?"}
  - {id: cls-9, task: classification, difficulty: 2, grader: choice, choices: [sports, politics, technology], expected: technology,
     prompt: "Which section does this headline belong in: sports, politics or technology? Reply with the section name.\n\nChipmaker unveils a 2-nanometer processor aimed at thin laptops."}
  - {id: cls-10, task: classification, difficulty: 2, grader: choice, choices: [billing, technical, account], expected: account,
     prompt: "Route this support message to billing, technical or account. Reply with the queue name only.\n\nPlease change the email address on my profile to my new work address, jo.park@example.com."}
  - {id: cls-11, task: classification, difficulty: 2, grader: choice, choices: [english, french, german, spanish], expected: german,
     prompt: "Which language is this sentence written in? Answer with the language name only.\n\nWir sehen uns morgen am Bahnhof."}
  - {id: cls-12, task: classification, difficulty: 3, grader: choice, choices: [complaint, inquiry, compliment], expected: inquiry,
     prompt: "Classify this customer email as complaint, inquiry or compliment. One word.\n\nYour team fixed my issue in ten minutes last week, so I'm hoping you can tell me whether the premium plan includes phone support."}
  - {id: cls-13, task: classification, difficulty: 3, grader: choice, choices: [cancel, upgrade, downgrade, pause], expected: downgrade,
     prompt: "Which intent best fits this message: cancel, upgrade, downgrade or pause? One word.\n\nWe still want the service, but the team shrank, so please move us to a cheaper tier with fewer seats."}
  - {id: cls-14, task: classification, difficulty: 4, grader: choice, choices: [entailment, contradiction, neutral], expected: neutral,
     prompt: "Given the premise and the hypothesis, answer entailment, contradiction or neutral. One word.\n\nPremise: The museum is closed on Mondays.\nHypothesis: The museum is busy on Tuesdays."}
  - {id: cls-15, task: classification, difficulty: 4, grader: choice, choices: [positive, negative, neutral], expected: positive,
     prompt: "What is the overall sentiment here: positive, negative or neutral? One word.\n\nI fully expected to hate the redesign, and honestly I can't say I miss the old layout at all."}
  - {id: cls-16, task: classification, difficulty: 4, grader: choice, choices: [phishing, legitimate], expected: phishing,
     prompt: "Our security inbox received this. Is it phishing or legitimate? One word.\n\nFrom: it-support@examp1e-helpdesk.com\nSubject: Mailbox quota exceeded\n\nYour mailbox will be deactivated in 24 hours. Confirm your password at the link below to keep your account active."}
  - {id: cls-17, task: classification, difficulty: 5, grader: choice, choices: [indemnification, limitation, termination, confidentiality], expected: limitation,
     prompt: "Which type of contract clause is this: indemnification, limitation, termination or confidentiality? One word.\n\nNeither party's aggregate liability under this Agreement shall exceed the fees paid in the twelve months preceding the claim, except for a party's obligation to defend and hold harmless the other party against third-party claims."}
  - {id: cls-18, task: classification, difficulty: 5, grader: choice, choices: [iambic, trochaic, anapestic, dactylic], expected: trochaic,
     prompt: "What is the dominant metrical foot of this line: iambic, trochaic, anapestic or dactylic? One word.\n\nOnce upon a midnight dreary, while I pondered, weak and weary"}
  - {id: cls-19, task: classification, difficulty: 5, grader: choice, choices: [constant, logarithmic, linear, linearithmic, quadratic], expected: linearithmic,
     prompt: "Classify the time complexity of this function as constant, logarithmic, linear, linearithmic or quadratic. One word.\n\n```python\ndef f(n):\n    total = 0\n    for i in range(n):\n        j = 1\n        while j < n:\n            total += 1\n            j *= 2\n    return total\n```"}
  - {id: cls-20, task: classification, difficulty: 5, grader: choice, choices: [valid, invalid], expected: valid,
     prompt: "Is this argument logically valid or invalid? One word.\n\nNo reptiles have fur. Some pets have fur. Therefore, some pets are not reptiles."}
  # extraction
  - {id: ext-1, task: extraction, difficulty: 1, grader: regex, expected: "ana\\.lima@example\\.com",
     prompt: "Extract the email address from this text. Return only the address.\n\nPlease reply to ana.lima@example.com by Friday."}
  - {id: ext-2, task: extraction, difficulty: 2, grader: json, expected: {name: "Sam Okafor", amount: 120},
     prompt: "Extract name and amount as JSON with keys name and amount (number).\n\nSam Okafor paid 120 dollars on 3 October."}
  - {id: ext-3, task: extraction, difficulty: 2, grader: json, expected: {city: "Pune", date: "2026-11-14"},
     prompt: "Extract the city and the ISO date as JSON with keys city and date.\n\nThe workshop moves to Pune on 14 November 2026."}
  - {id: ext-4, task: extraction, difficulty: 3, grader: json, expected: {order_id: "A-7741", items: 3, express: true},
     prompt: "Return JSON with keys order_id, items (number) and express (boolean).\n\nOrder A-7741: three items, customer upgraded to express delivery after checkout."}
  - {id: ext-5, task: extraction, difficulty: 4, grader: json, expected: {start: "2026-01-05", end: "2026-01-09", nights: 4},
     prompt: "From the booking note return JSON with start, end (ISO dates) and nights (number).\n\nArrive Monday 5 Jan 2026, leave the Friday of that week."}
  - {id: ext-6, task: extraction, difficulty: 5, grader: json, expected: {liable: "supplier", cap_usd: 50000},
     prompt: "Read the clause and return JSON with liable (customer or supplier) and cap_usd (number).\n\nNotwithstanding clause 9, losses arising from late delivery are borne by the party that dispatched the goods, limited to fifty thousand US dollars in aggregate. The supplier dispatches all goods."}
  - {id: ext-7, task: extraction, difficulty: 1, grader: regex, expected: "58213",
     prompt: "Pull out the order number from this message. Reply with just the number.\n\nHi, my order #58213 still hasn't shipped and it's been a week."}
  - {id: ext-8, task: extraction, difficulty: 1, grader: regex, expected: "https://docs\\.example\\.com/q3-review",
     prompt: "What is the link in this sentence? Return only the URL.\n\nThe slides are posted at https://docs.example.com/q3-review for anyone who missed the call."}
  - {id: ext-9, task: extraction, difficulty: 1, grader: regex, expected: "2026-03-17",
     prompt: "Give me the issue date from this note, formatted YYYY-MM-DD, and nothing else.\n\nThe invoice was issued on 2026-03-17 and is due in 30 days."}
  - {id: ext-10, task: extraction, difficulty: 2, grader: json, expected: {sku: "TX-209", quantity: 4},
     prompt: "Return JSON with keys sku (string) and quantity (number).\n\nPlease ship 4 units of SKU TX-209 to the Leeds office by next week."}
  - {id: ext-11, task: extraction, difficulty: 2, grader: json, expected: {first_name: "Priya", last_name: "Nair"},
     prompt: "Split the person's name into JSON with string keys first_name and last_name. Leave out titles.\n\nDr. Priya Nair, Head of Research"}
  - {id: ext-12, task: extraction, difficulty: 3, grader: json, expected: {amount: 1250, currency: "EUR"},
     prompt: "Return JSON with keys amount (number) and currency (three-letter ISO code).\n\nThe consultant's fee came to one thousand two hundred and fifty euros, VAT included."}
  - {id: ext-13, task: extraction, difficulty: 3, grader: json, expected: {owner: "Mina", deadline: "2026-02-20"},
     prompt: "Who owns the vendor contract and when is it due? Answer as JSON with keys owner (first name) and deadline (ISO date).\n\nNotes, 2 Feb 2026: Leo will draft the onboarding doc by Friday. Mina takes the vendor contract, due 20 February 2026. Leo also books the room for the offsite."}
  - {id: ext-14, task: extraction, difficulty: 3, grader: json, expected: {adults: 4, children: 3},
     prompt: "Return JSON with keys adults (number) and children (number) for this reservation.\n\nTable for the Garcia family, please: the two of us, our three kids, and my parents are joining too."}
  - {id: ext-15, task: extraction, difficulty: 4, grader: json, expected: {due_date: "2026-02-14", late: true},
     prompt: "Return JSON with keys due_date (ISO date) and late (boolean, true if the payment arrived after the due date).\n\nInvoice dated 2026-01-15, payment terms net 30. Paid in full on 2026-02-16."}
  - {id: ext-16, task: extraction, difficulty: 4, grader: json, expected: {city: "Manchester", postcode: "M4 1HN", country: "GB"},
     prompt: "Parse this shipping address into JSON with keys city, postcode and country (ISO 3166-1 alpha-2 code).\n\nShip to: Flat 3, 12 Rose Lane, Manchester M4 1HN, United Kingdom"}
  - {id: ext-17, task: extraction, difficulty: 4, grader: json, expected: {meeting_day: "Thursday", attendees: 4},
     prompt: "From this email, return JSON with keys meeting_day (weekday name) and attendees (number of people at the meeting).\n\nHi all, we were going to meet Wednesday but Tom can't make it, so let's push to the following day. It'll be me, Tom, Aisha and Ben; Carla is out on leave."}
  - {id: ext-18, task: extraction, difficulty: 5, grader: json, expected: {notice_days: 90, auto_renews: true},
     prompt: "Return JSON with keys notice_days (number) and auto_renews (boolean) as they apply to this customer.\n\nThis Agreement renews for successive one-year terms unless either party gives written notice of non-renewal at least sixty days before the end of the then-current term; provided that, if the Customer is a public body, the notice period is ninety days. The Customer is the transit authority of the City of Brookfield."}
  - {id: ext-19, task: extraction, difficulty: 5, grader: json, expected: {doses_per_day: 3, total_tablets: 31},
     prompt: "From the prescription, return JSON with keys doses_per_day (number) and total_tablets (number needed for the whole course).\n\nTake one 500 mg tablet every 8 hours for 10 days. The very first dose only should be doubled (two tablets)."}
  - {id: ext-20, task: extraction, difficulty: 5, grader: json, expected: {failed_jobs: 1, failed_ids: ["job-116"]},
     prompt: "From the log, return JSON with keys failed_jobs (number) and failed_ids (array of job ids). A job counts as failed only if its final attempt failed.\n\n09:01 job-114 ok\n09:04 job-115 failed (retry 1)\n09:05 job-115 ok\n09:09 job-116 failed (retry 1)\n09:12 job-116 failed (retry 2, giving up)\n09:15 job-117 ok"}
  # summarization
  - {id: sum-1, task: summarization, difficulty: 1, grader: contains, expected: [refund],
     prompt: "Summarize in one sentence.\n\nThe customer asked for a refund because the order arrived damaged; we approved it."}
  - {id: sum-2, task: summarization, difficulty: 2, grader: contains, expected: [database, migration],
     prompt: "Give a one-line summary.\n\nTonight the team will run the database migration. Expect five minutes of read-only mode around 23:00."}
  - {id: sum-3, task: summarization, difficulty: 2, grader: contains, expected: [budget, approved],
     prompt: "Summarize the key decision in one sentence.\n\nAfter discussion the board approved the revised budget, with marketing reduced by ten percent."}
  - {id: sum-4, task: summarization, difficulty: 3, grader: contains, expected: [latency, cache],
     prompt: "Summarize the incident cause and fix in one sentence.\n\nP95 latency rose to 4 s after the deploy because the cache was disabled by a config typo. Re-enabling the cache restored 300 ms."}
  - {id: sum-5, task: summarization, difficulty: 4, grader: contains, expected: [churn, onboarding],
     prompt: "Summarize the analysis in one sentence, naming the main driver.\n\nChurn rose 3 points this quarter. Pricing and support scores were flat. Users who skipped the new onboarding flow churned at twice the rate of those who finished it."}
  - {id: sum-6, task: summarization, difficulty: 5, grader: contains, expected: [conflict, vendor],
     prompt: "Summarize the risk in one sentence.\n\nThe security review passed, yet legal flagged that our vendor's data processing terms conflict with the customer's residency requirement; procurement is unaware."}
  - {id: sum-7, task: summarization, difficulty: 1, grader: contains, expected: [closed, monday],
     prompt: "Summarize in one sentence.\n\nThe office will be closed on Monday for the public holiday. Normal hours resume on Tuesday."}
  - {id: sum-8, task: summarization, difficulty: 1, grader: contains, expected: [late, train],
     prompt: "TL;DR this message in a few words.\n\nHey, just a heads-up that I'm running about 15 minutes late to the standup because my train is delayed."}
  - {id: sum-9, task: summarization, difficulty: 1, grader: contains, expected: [maintenance, saturday],
     prompt: "Shorten this notice to one line.\n\nOur website will be down for scheduled maintenance from 01:00 to 03:00 UTC on Saturday. We apologise for the inconvenience."}
  - {id: sum-10, task: summarization, difficulty: 2, grader: contains, expected: [dark mode],
     prompt: "Write a one-sentence summary of this product update.\n\nVersion 4.2 adds dark mode to the mobile app, fixes a crash when uploading large photos, and makes search noticeably faster."}
  - {id: sum-11, task: summarization, difficulty: 2, grader: regex, expected: "order",
     prompt: "What is the customer's main complaint? One sentence.\n\nI've been a loyal customer for six years. The new app looks nice, but since the update I can't see my past orders anywhere, and I need them for my expense reports."}
  - {id: sum-12, task: summarization, difficulty: 3, grader: contains, expected: [wednesday],
     prompt: "Summarize the outcome of this chat thread in one sentence.\n\nAna: Are we still shipping Friday?\nRaj: QA found two blockers in payments.\nAna: Then we wait.\nRaj: Fixes should land Tuesday, so let's target the day after.\nAna: Agreed, let's do that."}
  - {id: sum-13, task: summarization, difficulty: 3, grader: contains, expected: [blood pressure],
     prompt: "Summarize this abstract for a general audience in two sentences.\n\nWe conducted a randomized trial of 1,200 adults comparing a daily 20-minute walk with no intervention. After 12 weeks, the walking group showed a mean reduction in systolic blood pressure of 5 mmHg relative to controls, with no adverse events reported."}
  - {id: sum-14, task: summarization, difficulty: 3, grader: regex, expected: "refund",
     prompt: "In one sentence, why was the experiment stopped?\n\nThe A/B test of the new checkout ran for nine days. Conversion was up 2 percent, but refund requests in the variant tripled, so the team halted the test pending a review of the new return flow."}
  - {id: sum-15, task: summarization, difficulty: 4, grader: contains, expected: [certificate],
     prompt: "Summarize the root cause in one sentence for an executive.\n\nAt 14:02 the payments API began timing out. Engineers first suspected the database, but its metrics were normal. The real problem was an expired TLS certificate on the internal service that issues fraud scores; calls to it hung until the 30-second timeout, which blocked every payment. Renewing it restored service at 14:47."}
  - {id: sum-16, task: summarization, difficulty: 4, grader: regex, expected: "baseline",
     prompt: "Summarize the reviewer's overall recommendation in one sentence.\n\nThe paper's method is novel and the writing is clear. However, the evaluation uses a single dataset, and the comparison numbers for prior methods are copied from an earlier paper that used a different preprocessing pipeline, so the claimed gains may not hold. I would support acceptance only if the authors rerun the baselines under identical conditions."}
  - {id: sum-17, task: summarization, difficulty: 4, grader: contains, expected: [sales, october],
     prompt: "Condense this into a single sentence that says who has to act and by when.\n\nFrom finance: Q3 expense reports are being processed and most teams are done. The sales team still has 14 open reports, and anything not submitted by 31 October will roll into next quarter's budget, which reduces their Q4 allowance."}
  - {id: sum-18, task: summarization, difficulty: 5, grader: contains, expected: [encryption key],
     prompt: "In one sentence, what is the most serious risk hidden in this plan?\n\nThe migration plan looks solid. Each service moves to the new cluster over the next month, one per day, and rollback is a DNS switch. The auth service and the session store share a single encryption key that exists only in the old cluster's secret manager. The old cluster is scheduled for shutdown the day after the last service moves."}
  - {id: sum-19, task: summarization, difficulty: 5, grader: contains, expected: [renewal, "12"],
     prompt: "Summarize, in one sentence, what actually changes for existing customers.\n\nWe are pleased to announce simplified pricing. The Starter plan is renamed Basic. New customers on Basic pay $12 per month. Existing Starter customers keep their current $10 price until their next renewal, after which they move to the $12 Basic price. Pro and Enterprise are unchanged."}
  - {id: sum-20, task: summarization, difficulty: 5, grader: regex, expected: "caus|correlat",
     prompt: "Summarize the study's conclusion in one sentence, without overstating it.\n\nIn an observational study of 40,000 office workers, those who used standing desks reported 15 percent less back pain. The authors caution that standing-desk users were also younger and exercised more, and that the design cannot establish that the desks themselves reduced pain."}

     prompt: "Can you put this into French? The train leaves at eight o'clock."}
  - {id: tr-11, task: translation, difficulty: 2, grader: contains, expected: [onde],
     prompt: "Please translate into Portuguese: Where is the bathroom?"}
  - {id: tr-12, task: translation, difficulty: 3, grader: contains, expected: [puede],
     prompt: "Translate into Spanish, addressing the person formally with usted: Can you help me find my luggage?"}
  - {id: tr-13, task: translation, difficulty: 3, grader: contains, expected: [freuen],

  - {id: tr-16, task: translation, difficulty: 4, grader: regex, expected: "te extraño|te echo de menos",
     prompt: "How would a native speaker say this in Spanish? Not a literal rendering, please: I miss you."}
  - {id: tr-17, task: translation, difficulty: 4, grader: regex, expected: "verschoben|vertagt",
     prompt: "Translate into German for an internal announcement: The meeting has been postponed until further notice."}
  - {id: tr-18, task: translation, difficulty: 5, grader: contains, expected: [tiro],
     prompt: "Give the natural Spanish equivalent of this English idiom, using the expression a Spanish speaker would actually use: to kill two birds with one stone"}
  - {id: tr-19, task: translation, difficulty: 5, grader: contains, expected: [greek],
     prompt: "What is the natural English equivalent of the German idiom 'Ich verstehe nur Bahnhof'? Give the English expression, not a literal translation."}
  - {id: tr-20, task: translation, difficulty: 5, grader: contains, expected: [sensitive, currently],
     prompt: "Translate into English, watching out for false friends: Je suis sensible au froid, alors actuellement je reste chez moi."}
  # math

     prompt: "What is the remainder when 7^100 is divided by 13? Number only."}
  - {id: math-20, task: math, difficulty: 5, grader: number, expected: 0.161, tolerance: 0.001,
     prompt: "A disease affects 1% of a population. A test detects it 95% of the time when it is present and gives a false positive 5% of the time when it is absent. If someone tests positive, what is the probability they have the disease? Decimal rounded to 3 places, number only."}
  # reasoning
  - {id: rsn-1, task: reasoning, difficulty: 2, grader: contains, expected: [tuesday],

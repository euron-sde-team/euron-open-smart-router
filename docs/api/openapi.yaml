  /api/v1/decisions:
    get:
      tags:
      - decisions and analytics
      summary: The routing decision log
      operationId: list_decisions_api_v1_decisions_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      - name: policy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: task
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Task
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: fallback
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Fallback
      - name: source
        in: query
        required: false
        schema:
          enum:
          - api
          - benchmark
          type: string
          description: 'api: real traffic (default); benchmark: benchmark policy runs'
          default: api
          title: Source
        description: 'api: real traffic (default); benchmark: benchmark policy runs'
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Request id prefix
          title: Q
        description: Request id prefix

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: sanitization and OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-sanitization.sh
      - uses: astral-sh/setup-uv@v6
      - name: OpenAPI reference matches the app
        working-directory: apps/api
        run: uv sync --frozen && uv run pytest tests/unit/test_openapi_drift.py -q

  integration:
    name: integration tests (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: smartrouter
          POSTGRES_PASSWORD: smartrouter
          POSTGRES_DB: smartrouter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartrouter"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://smartrouter:smartrouter@localhost:5432/smartrouter_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12 && uv sync --frozen
      - run: uv run pytest tests -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=85
